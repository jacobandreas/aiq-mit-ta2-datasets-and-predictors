# HELM runs backing the MAGNET circuit overlap cards.
#
# Each split has a test run (<split>) and a train run (<split>_train) whose
# items are the split's train items relabelled as test, so HELM generates
# completions and exact_match labels for them.  All runs are 0-shot
# (max_train_instances=0 in the aiq-mit-ta2 run specs).
#
# From /raid/lingo/jda/code/darpa3:
#   CUDA_VISIBLE_DEVICES=<gpu> XDG_CACHE_HOME=/raid/lingo/jda/.cache helm-run \
#       --conf-paths magnet_adapter/helm_confs/arith_ewok.conf \
#       --suite suite_2 --output-path benchmark_output \
#       --models-to-run huggingface/Qwen3-4B --max-eval-instances 10000

entries: [
  {description: "arithmetic_fixed:split_config=cross_lingual", priority: 1}
  {description: "arithmetic_fixed:split_config=cross_lingual_train", priority: 1}
  {description: "arithmetic_parametric:split_config=arithmetic_by_format", priority: 1}
  {description: "arithmetic_parametric:split_config=arithmetic_by_format_train", priority: 1}
  {description: "arithmetic_parametric:split_config=arithmetic_by_skill", priority: 1}
  {description: "arithmetic_parametric:split_config=arithmetic_by_skill_train", priority: 1}
  {description: "world_modeling:split_config=ewok_physical_to_social", priority: 1}
  {description: "world_modeling:split_config=ewok_physical_to_social_train", priority: 1}
  {description: "world_modeling:split_config=ewok_social_to_physical", priority: 1}
  {description: "world_modeling:split_config=ewok_social_to_physical_train", priority: 1}
]
