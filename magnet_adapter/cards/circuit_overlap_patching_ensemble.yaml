# KWDagger recipe card; run with `magnet evaluate_new`:
#
#   cd <this repo>
#   PYTHONPATH=. magnet evaluate_new magnet_adapter/cards/circuit_overlap_patching_ensemble.yaml \
#       --output_path=./evaluation_runs_kwdagger --backend=serial
#
# The run_circuit_overlap node is identical to the one in
# circuit_overlap_patching.yaml, so KWDagger reuses that card's results (and
# running either card computes both).  Keep the two in sync.

name: circuit_overlap_patching_ensemble
title: "CircuitOverlap (attribution patching) + TokenProb — improvement over the token prob baseline"
description: |
  Combining circuit overlap (attribution patching, see
  circuit_overlap_patching.yaml) with the token prob baseline should predict
  per-instance accuracy better than token prob alone.

  combined = w * rank(circuit overlap) + (1 - w) * rank(token prob), with
  ranks taken as percentiles within the test set.  The single parameter w
  is fitted per (model, split) on the train split: it is the value on the
  grid 0, 0.05, ..., 1 that maximizes the combination's AUC on the train
  items, whose correctness labels the predictor sees (ties go to the w
  nearest 0.5).  No test labels are used.  Only items scored with their own
  counterfactual contribute circuit overlap; items scored with a fallback
  (random length-matched) contrast, or not scored, take the token prob
  percentile alone.  Both predictors score the model's own completion.
  Results also report the equal-weight (w = 0.5) AUC for comparison.

  The claim is per model, over its splits: the combination never does worse
  than token prob on any split (gain >= 0), and improves on it on average
  across splits (mean gain > 0).  A gain of exactly 0 means the train fit
  chose w = 0, i.e. circuit overlap was not used for that split.  Splits:

  - arithmetic_fixed/cross_lingual: english+symbolic → spanish+italian
  - arithmetic_parametric/arithmetic_by_format: symbolic+english → italian+chinese
  - arithmetic_parametric/arithmetic_by_skill: {+,-},{+,*} → {-,*},{*},{-}
  - world_modeling/ewok_physical_to_social: EWOK physical domains → social domains
  - world_modeling/ewok_social_to_physical: EWOK social domains → physical domains

version: 1.0

organizations:
  - MIT

submitter:
  name: MIT TA2 Team
  email: jda@mit.edu

tags:
  - qwen
  - llama
  - predictor
  - circuit_overlap
  - attribution_patching
  - ensemble
  - arithmetic
  - ewok
  - instance_prediction

links:
  - title: "aiq-mit-ta2-datasets-and-predictors (predictor source)"
    url: "https://github.com/jacobandreas/aiq-mit-ta2-datasets-and-predictors"
    type: "software"
  - title: "arithmetic_fixed, arithmetic_parametric and world_modeling datasets"
    url: "https://github.com/AIQ-Kitware/aiq-mit-ta2"
    type: "dataset"
  - title: "EWOK-CORE 1.0"
    url: "https://huggingface.co/datasets/ewok-core/ewok-core-1.0"
    type: "dataset"


claim:
  python: |
    s = summarize_gains
    assert s.min_gain >= 0, (
        f"CircuitOverlap + TokenProb is worse than TokenProb for {s.model} on "
        f"{s.worst_split} (gain {s.min_gain:.4f})"
    )
    assert s.mean_gain > 0, (
        f"CircuitOverlap + TokenProb does not beat TokenProb on average for "
        f"{s.model}: mean gain {s.mean_gain:.4f} over {s.n_splits} splits"
    )

evidence:
  scope: requested

symbols:
  metrics.summarize_gains.mean_combined_auc:
    metadata:
      kind: metric
      display: true
      display_name: "CircuitOverlap + TokenProb AUC (mean over splits)"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  metrics.summarize_gains.mean_token_prob_auc:
    metadata:
      kind: metric
      display: true
      display_name: "TokenProb AUC (baseline, mean over splits)"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  metrics.summarize_gains.mean_gain:
    metadata:
      kind: metric
      display: true
      display_name: "AUC gain over baseline (mean over splits)"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  metrics.summarize_gains.min_gain:
    metadata:
      kind: metric
      display: true
      display_name: "AUC gain over baseline (worst split)"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: min

  metrics.summarize_gains.model:
    metadata:
      kind: model
      display: true
      display_name: "Model"

kwdagger:
  result_node: summarize_gains

  pipeline:
    nodes:
      run_circuit_overlap:
        executable: 'python -u magnet_adapter/run_predictor_card.py'
        algo_params:
          helm_suite_path: './benchmark_output/runs/suite_2'
          split_config: null
          model: null
          k_fraction: 0.01
          batch_size: 4
          counterfactuals_dpath: './magnet_adapter/counterfactuals'
          reference_id_regex: null
          position: null
          # Items with no usable counterfactual are contrasted with a random
          # length-matched prompt from the same split, redrawn (up to 20
          # decodes) until the model's answer differs.
          fallback_max_draws: 20
          # Circuit overlap weight in the combination with token prob, chosen
          # per split to maximize the combined AUC on the train items.
          weight: 'train'
          # The reference loads models in float16.
          dtype: 'float16'
        out_paths:
          results_fpath: 'results.json'
        primary_out_key: results_fpath
        load_result: 'magnet_adapter.run_predictor_card.load_kwdagger_result'

      # One per model: gathers that model's per-split results (CPU only).
      summarize_gains:
        executable: 'python -u magnet_adapter/summarize_gains.py'
        in_paths: [results_fpaths]
        algo_params:
          model: null
        out_paths:
          summary_fpath: 'summary.json'
        primary_out_key: summary_fpath
        load_result: 'magnet_adapter.summarize_gains.load_kwdagger_result'

    edges:
      - src: run_circuit_overlap.results_fpath
        dst: summarize_gains.results_fpaths
        gather:
          group_by: [model]
          order_by: [split_config]
          require: all_success

  matrix:
    summarize_gains.model:
      - huggingface/Qwen3-4B
      - huggingface/Qwen3-8B
      - huggingface/Llama-3.1-8B-Instruct
    run_circuit_overlap.model:
      - huggingface/Qwen3-4B
      - huggingface/Qwen3-8B
      - huggingface/Llama-3.1-8B-Instruct
    run_circuit_overlap.split_config:
      - arithmetic_by_skill
      - cross_lingual
      - arithmetic_by_format
      - ewok_physical_to_social
      - ewok_social_to_physical
    include:
      # Reference circuit from the symbolic train items only, read at the
      # last prompt token, as in arithmetic-inconsistencies.
      - run_circuit_overlap.split_config: cross_lingual
        run_circuit_overlap.reference_id_regex: '^symbolic_'
        run_circuit_overlap.position: last
      - run_circuit_overlap.split_config: arithmetic_by_format
        run_circuit_overlap.reference_id_regex: ''
        run_circuit_overlap.position: last_unaligned
      - run_circuit_overlap.split_config: arithmetic_by_skill
        run_circuit_overlap.reference_id_regex: ''
        run_circuit_overlap.position: last
      - run_circuit_overlap.split_config: ewok_physical_to_social
        run_circuit_overlap.reference_id_regex: ''
        run_circuit_overlap.position: last_unaligned
      - run_circuit_overlap.split_config: ewok_social_to_physical
        run_circuit_overlap.reference_id_regex: ''
        run_circuit_overlap.position: last_unaligned
