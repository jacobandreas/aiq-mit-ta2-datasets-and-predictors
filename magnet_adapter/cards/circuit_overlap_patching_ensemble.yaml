# KWDagger recipe card; run with `magnet evaluate_new`:
#
#   cd <this repo>
#   PYTHONPATH=. magnet evaluate_new magnet_adapter/cards/circuit_overlap_patching_ensemble.yaml \
#       --output_path=./evaluation_runs_kwdagger --backend=serial
#
# The run_circuit_overlap node is identical to the one in
# circuit_overlap_patching.yaml, so KWDagger reuses that card's results (and
# running either card computes both).  Keep the two in sync.

name: circuit_overlap_patching_ensemble
title: "CircuitOverlap (attribution patching) + TokenProb — improvement over the token prob baseline"
description: |
  Combining circuit overlap (attribution patching, see
  circuit_overlap_patching.yaml) with the token prob baseline should predict
  per-instance accuracy better than token prob alone.

  combined = mean of the two predictors' within-test-set rank percentiles
  (equal weight; nothing is fitted and no labels are used).  Only items
  scored with their own counterfactual contribute circuit overlap; items
  scored with a fallback (random length-matched) contrast, or not scored,
  take the token prob percentile alone.  Both predictors score the model's
  own completion.  Splits:

  - arithmetic_fixed/cross_lingual: english+symbolic → spanish+italian
  - arithmetic_parametric/arithmetic_by_format: symbolic+english → italian+chinese
  - arithmetic_parametric/arithmetic_by_skill: {+,-},{+,*} → {-,*},{*},{-}
  - world_modeling/ewok_physical_to_social: EWOK physical domains → social domains
  - world_modeling/ewok_social_to_physical: EWOK social domains → physical domains

version: 1.0

organizations:
  - MIT

submitter:
  name: MIT TA2 Team
  email: jda@mit.edu

tags:
  - qwen
  - predictor
  - circuit_overlap
  - attribution_patching
  - ensemble
  - arithmetic
  - ewok
  - instance_prediction

links:
  - title: "aiq-mit-ta2-datasets-and-predictors (predictor source)"
    url: "https://github.com/jacobandreas/aiq-mit-ta2-datasets-and-predictors"
    type: "software"
  - title: "arithmetic_fixed, arithmetic_parametric and world_modeling datasets"
    url: "https://github.com/AIQ-Kitware/aiq-mit-ta2"
    type: "dataset"
  - title: "EWOK-CORE 1.0"
    url: "https://huggingface.co/datasets/ewok-core/ewok-core-1.0"
    type: "dataset"


claim:
  python: |
    r = run_circuit_overlap
    assert r.combined_gain > 0, (
        f"CircuitOverlap + TokenProb AUC for {r.model} on {r.split_config} "
        f"({r.combined_auc:.3f}) does not beat TokenProb ({r.token_prob_auc:.3f})"
    )

evidence:
  scope: requested

symbols:
  metrics.run_circuit_overlap.combined_auc:
    metadata:
      kind: metric
      display: true
      display_name: "CircuitOverlap + TokenProb AUC"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  metrics.run_circuit_overlap.token_prob_auc:
    metadata:
      kind: metric
      display: true
      display_name: "TokenProb AUC (baseline)"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  metrics.run_circuit_overlap.combined_gain:
    metadata:
      kind: metric
      display: true
      display_name: "AUC gain over baseline"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  metrics.run_circuit_overlap.model:
    metadata:
      kind: model
      display: true
      display_name: "Model"

  metrics.run_circuit_overlap.split_config:
    metadata:
      kind: dataset
      display: true
      display_name: "Split"

kwdagger:
  result_node: run_circuit_overlap

  pipeline:
    nodes:
      run_circuit_overlap:
        executable: 'python -u magnet_adapter/run_predictor_card.py'
        algo_params:
          helm_suite_path: './benchmark_output/runs/suite_2'
          split_config: null
          model: null
          # Weights for HELM's huggingface/Qwen3-4B (revision 1cfa9a7).
          model_path: 'Qwen/Qwen3-4B'
          k_fraction: 0.01
          batch_size: 4
          counterfactuals_dpath: './magnet_adapter/counterfactuals'
          reference_id_regex: null
          position: null
          # Items with no usable counterfactual are contrasted with a random
          # length-matched prompt from the same split, redrawn (up to 20
          # decodes) until the model's answer differs.
          fallback_max_draws: 20
          # The reference loads models in float16.
          dtype: 'float16'
        out_paths:
          results_fpath: 'results.json'
        primary_out_key: results_fpath
        load_result: 'magnet_adapter.run_predictor_card.load_kwdagger_result'

  matrix:
    run_circuit_overlap.model:
      - huggingface/Qwen3-4B
    run_circuit_overlap.split_config:
      - arithmetic_by_skill
      - cross_lingual
      - arithmetic_by_format
      - ewok_physical_to_social
      - ewok_social_to_physical
    include:
      # Reference circuit from the symbolic train items only, read at the
      # last prompt token, as in arithmetic-inconsistencies.
      - run_circuit_overlap.split_config: cross_lingual
        run_circuit_overlap.reference_id_regex: '^symbolic_'
        run_circuit_overlap.position: last
      - run_circuit_overlap.split_config: arithmetic_by_format
        run_circuit_overlap.reference_id_regex: ''
        run_circuit_overlap.position: last_unaligned
      - run_circuit_overlap.split_config: arithmetic_by_skill
        run_circuit_overlap.reference_id_regex: ''
        run_circuit_overlap.position: last
      - run_circuit_overlap.split_config: ewok_physical_to_social
        run_circuit_overlap.reference_id_regex: ''
        run_circuit_overlap.position: last_unaligned
      - run_circuit_overlap.split_config: ewok_social_to_physical
        run_circuit_overlap.reference_id_regex: ''
        run_circuit_overlap.position: last_unaligned
