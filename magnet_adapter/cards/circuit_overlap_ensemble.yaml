# KWDagger recipe card; run with `magnet evaluate_new`:
#
#   cd /raid/lingo/jda/code/darpa3
#   PYTHONPATH=. magnet evaluate_new magnet_adapter/cards/circuit_overlap_ensemble.yaml \
#       --output_path=./evaluation_runs_kwdagger --backend=serial
#
# The run_circuit_overlap node is identical to the one in circuit_overlap_auc.yaml,
# so with the same --output_path KWDagger reuses that card's cached results.

name: circuit_overlap_ensemble
title: "CircuitOverlap Predictor — improves a token-probability baseline"
description: |
  Combining the circuit overlap predictor with a token-probability baseline
  should predict per-instance accuracy better than the baseline alone.

  The baseline scores each test item by the model's mean log-probability of
  its own greedy completion.  The combination is the mean of the two
  predictors' rank percentiles over the test set (no parameters fit on
  labels).  Circuit overlap builds its reference circuit from the split's
  train items (HELM run <split>_train); both predictors score the split's test
  items (HELM run <split>).  AUC is computed against exact-match labels.

version: 1.0

organizations:
  - MIT

submitter:
  name: MIT TA2 Team
  email: jda@mit.edu

tags:
  - qwen
  - predictor
  - circuit_overlap
  - token_prob
  - ensemble
  - arithmetic
  - ewok
  - instance_prediction

links:
  - title: "darpa3 (predictor source)"
    url: "https://github.com/mit-ll/darpa3"
    type: "software"
  - title: "arithmetic_fixed, arithmetic_parametric and world_modeling datasets"
    url: "https://github.com/mit-ll/aiq-mit-ta2"
    type: "dataset"
  - title: "EWOK-CORE 1.0"
    url: "https://huggingface.co/datasets/ewok-core/ewok-core-1.0"
    type: "dataset"

# Required AUC gain over the baseline, per split; placeholders until set from
# observed results.
claim:
  python: |
    margins = {
        "cross_lingual": 0.0,
        "arithmetic_by_format": 0.0,
        "arithmetic_by_skill": 0.0,
        "ewok_physical_to_social": 0.0,
        "ewok_social_to_physical": 0.0,
    }
    r = run_circuit_overlap
    margin = margins[r.split_config]
    assert r.combined_gain > margin, (
        f"On {r.split_config}, circuit overlap + token prob (AUC {r.combined_auc:.3f}) "
        f"does not beat token prob alone (AUC {r.token_prob_auc:.3f}) by more than {margin:.2f}"
    )

evidence:
  scope: requested

symbols:
  metrics.run_circuit_overlap.combined_auc:
    metadata:
      kind: metric
      display: true
      display_name: "CircuitOverlap + TokenProb AUC"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  metrics.run_circuit_overlap.token_prob_auc:
    metadata:
      kind: metric
      display: true
      display_name: "TokenProb AUC (baseline)"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  metrics.run_circuit_overlap.combined_gain:
    metadata:
      kind: metric
      display: true
      display_name: "AUC gain over baseline"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  metrics.run_circuit_overlap.model:
    metadata:
      kind: model
      display: true
      display_name: "Model"

  metrics.run_circuit_overlap.split_config:
    metadata:
      kind: dataset
      display: true
      display_name: "Split"

kwdagger:
  result_node: run_circuit_overlap

  # Keep identical to circuit_overlap_auc.yaml so results are shared.
  pipeline:
    nodes:
      run_circuit_overlap:
        executable: '/raid/lingo/jda/anaconda3/envs/darpa3-helm/bin/python -u magnet_adapter/run_predictor_card.py'
        algo_params:
          helm_suite_path: './benchmark_output/runs/suite_2'
          split_config: null
          model: null
          models_root: '/raid/lingo/models'
          k_fraction: 0.01
          batch_size: 4
          answer: 'completion'
        out_paths:
          results_fpath: 'results.json'
        primary_out_key: results_fpath
        load_result: 'magnet_adapter.run_predictor_card.load_kwdagger_result'

  matrix:
    run_circuit_overlap.model:
      - huggingface/Qwen3-4B
    run_circuit_overlap.split_config:
      - cross_lingual
      - arithmetic_by_format
      - arithmetic_by_skill
      - ewok_physical_to_social
      - ewok_social_to_physical
